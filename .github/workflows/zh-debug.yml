name: Chinese Debug APK comparison
on:
  push:
    branches: ['test/zh-debug-apk-20261125']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Prepare SDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=3 > sdk-packages.txt
          grep -E "platforms;android-|ndk;|cmake;" sdk-packages.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"
          chmod +x gradlew
      - name: Upload SDK availability report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-availability
          path: sdk-packages.txt
      - name: Isolate standard test package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = 'applicationId = if (vivoOrigin) "com.tencent.qqmusic" else "com.lastwave.app"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old.replace('else "com.lastwave.app"', 'else "com.lastwave.app.zhdebug"')))
          PY
      - name: Verify Chinese localization
        run: ./gradlew :app:testDebugUnitTest --tests com.lastwave.app.util.AppTextTest -PtargetAbis=arm64-v8a --stacktrace --max-workers=2
      - name: Build standard Debug (arm64 for GT6)
        run: ./gradlew :app:assembleDebug -PtargetAbis=arm64-v8a --stacktrace --max-workers=2
      - name: Stage standard APK
        run: |
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/app-debug.apk final_apk/LastWave-zh-standard-debug-arm64.apk
      - name: Upload standard APK immediately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LastWave-zh-standard-debug-arm64
          path: final_apk/LastWave-zh-standard-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build vivo-origin Debug (original package)
        run: ./gradlew :app:assembleDebug -PtargetAbis=arm64-v8a -PvivoOrigin=true --stacktrace --max-workers=2
      - name: Stage and verify both APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk final_apk/LastWave-zh-vivo-origin-debug-arm64.apk
          TOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          for apk in final_apk/*.apk; do
            "$TOOLS" verify --print-certs "$apk"
            "$AAPT" dump badging "$apk" | head -1
          done
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' "Build source: $GITHUB_SHA" 'Android 10+ arm64 only. Standard: com.lastwave.app.zhdebug. vivo-origin: com.tencent.qqmusic; conflicts with QQ Music.' 'Debug signed; no private signing/API secrets supplied. Fresh runs may use different debug certificates.' > final_apk/README.txt
          cat final_apk/README.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comparison APKs and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LastWave-zh-debug-comparison-arm64
          path: final_apk/*
          if-no-files-found: error
          retention-days: 14
