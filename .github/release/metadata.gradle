import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.util.zip.ZipFile
gradle.projectsEvaluated {
  def app = gradle.rootProject.project(':app')
  app.tasks.register('collectDistributionMetadata') {
    doLast {
      def out = new File(gradle.rootProject.projectDir, 'distribution-metadata')
      out.mkdirs()
      def manifest = new File(out, 'DEPENDENCIES.tsv')
      def missing = new File(out, 'UNAVAILABLE.txt')
      manifest.text = "coordinate\tartifact\n"
      missing.text = ""
      def configuration = app.configurations.getByName('debugRuntimeClasspath')
      configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        def id = artifact.id.componentIdentifier
        if (!(id instanceof ModuleComponentIdentifier)) return
        def coord = "${id.group}:${id.module}:${id.version}"
        def dir = new File(out, coord.replace(':', '/'))
        dir.mkdirs()
        manifest << "${coord}\t${artifact.file.name}\n"
        ['@pom', ':sources@jar'].each { suffix ->
          try {
            def cfg = app.configurations.detachedConfiguration(app.dependencies.create(coord + suffix))
            cfg.transitive = false
            cfg.resolve().each { file -> new File(dir, file.name).bytes = file.bytes }
          } catch (Exception ignored) { missing << coord + suffix + "\n" }
        }
        def extractNotices = { File file, String prefix ->
          if (!(file.name.endsWith('.jar') || file.name.endsWith('.aar'))) return
          new ZipFile(file).withCloseable { zip ->
            zip.entries().each { entry ->
              if (!entry.directory && entry.name.toLowerCase().matches('.*(license|notice|copying|copyright).*')) {
                def name = prefix + entry.name.replace('/', '_')
                new File(dir, name).bytes = zip.getInputStream(entry).bytes
              }
              if (!entry.directory && entry.name == 'classes.jar') {
                def nested = new File(temporaryDir, dir.name + '-classes.jar')
                nested.bytes = zip.getInputStream(entry).bytes
                new ZipFile(nested).withCloseable { jar ->
                  jar.entries().each { e ->
                    if (!e.directory && e.name.toLowerCase().matches('.*(license|notice|copying|copyright).*'))
                      new File(dir, 'classes_' + e.name.replace('/', '_')).bytes = jar.getInputStream(e).bytes
                  }
                }
              }
            }
          }
        }
        extractNotices(artifact.file, '')
      }
    }
  }
}
